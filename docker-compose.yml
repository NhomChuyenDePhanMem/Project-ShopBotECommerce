# PostgreSQL cho backend (ShopBot / SShopBot). Chạy: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: shopbot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sshopbot
    ports:
      - '5432:5432'
    volumes:
      - shopbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sshopbot']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shopbot_pgdata:
